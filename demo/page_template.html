<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>moonvoice — 在浏览器里处理一段音频</title>
<style>
  :root { --bg:#101216; --panel:#181c22; --line:#282e38; --fg:#e8ebf0; --dim:#8d97a8;
          --accent:#2dd4bf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:19px; font-weight:600; margin:0 0 6px; }
  .lead { color:var(--dim); margin:0 0 24px; }
  .lead b { color:var(--fg); font-weight:600; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:16px; margin-bottom:14px; }
  canvas { display:block; width:100%; height:132px; border-radius:6px;
           background:#0b0e13; cursor:crosshair; }
  .meta { color:var(--dim); font-size:13px; margin:10px 0 0; }
  .meta b { color:var(--fg); font-weight:600; }
  button { font:inherit; font-weight:600; padding:10px 20px; border-radius:8px; border:0;
           background:var(--accent); color:#062b28; cursor:pointer; }
  button:disabled { background:#2a3038; color:#6b7482; cursor:default; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  audio { width:100%; margin-top:10px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td { padding:7px 0; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  td:first-child { color:var(--dim); width:150px; }
  td:last-child { font-family:ui-monospace,Consolas,monospace; }
  .big { color:var(--accent); font-weight:600; }
  .hide { display:none; }
  code { background:#0b0e13; padding:1px 5px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>
<main>

  <h1>在浏览器里用 moonvoice 处理一段音频</h1>
  <p class="lead">
    下面这个处理<strong>跑在你浏览器里的 WebAssembly 上</strong>——就是把本仓库的 MoonBit
    技能 <code>cmd/vad</code> 编译成 wasm（117 KB）加载执行，不是预先算好的结果。
    拖动波形选一段，处理，然后对比听。
  </p>

  <section>
    <canvas id="wave"></canvas>
    <p class="meta" id="selInfo">拖动波形选择要处理的片段</p>
  </section>

  <section class="row">
    <button id="run" disabled>用 moonvoice 处理这段</button>
    <span class="meta" id="status"></span>
  </section>

  <section id="result" class="hide">
    <table>
      <tr><td>原始片段</td><td id="mBefore"></td></tr>
      <tr><td>处理结果</td><td id="mAfter"></td></tr>
      <tr><td>处理耗时</td><td id="mTime"></td></tr>
      <tr><td>实时倍率</td><td id="mRT"></td></tr>
    </table>
    <p class="meta" style="margin-top:14px">处理前（原样）</p>
    <audio id="audioBefore" controls></audio>
    <p class="meta" style="margin-top:8px">处理后（去静音 / 16 kHz 单声道 / −16 LUFS）</p>
    <audio id="audioAfter" controls></audio>
  </section>

</main>

<script>
// ── 内嵌资源（由 demo/build_page.py 注入） ────────────────────────────────
const BEFORE_MP3_B64 = "__BEFORE_MP3__";
const VAD_WASM_B64   = "__VAD_WASM__";
const WASI_SHIM_SRC  = __SHIM__;   // 最小 WASI 运行时源码（字符串）

// ── WAV 读写（只处理 16-bit PCM —— 本页素材就是这个格式） ──────────────
function parseWav(buf) {
  const dv = new DataView(buf);
  const tag = (o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o+1), dv.getUint8(o+2), dv.getUint8(o+3));
  if (tag(0) !== "RIFF" || tag(8) !== "WAVE") throw new Error("不是 WAV");
  let p = 12, fmt = null, data = null;
  while (p + 8 <= buf.byteLength) {
    const id = tag(p), size = dv.getUint32(p + 4, true), body = p + 8;
    if (id === "fmt ") {
      fmt = { format: dv.getUint16(body, true), channels: dv.getUint16(body + 2, true),
              rate: dv.getUint32(body + 4, true), bits: dv.getUint16(body + 14, true) };
    } else if (id === "data") {
      data = { offset: body, size };
    }
    p = body + size + (size % 2);
  }
  if (!fmt || !data) throw new Error("WAV 缺 fmt 或 data 块");
  if (fmt.bits !== 16 || fmt.format !== 1) throw new Error("只支持 16-bit PCM");
  return { ...fmt, dataOffset: data.offset, dataSize: data.size,
           frames: data.size / (fmt.channels * 2) };
}
function sliceWav(w, startFrame, endFrame) {
  const bpf = w.channels * 2;
  const bytes = w.dataSize - startFrame * bpf > (endFrame - startFrame) * bpf
    ? (endFrame - startFrame) * bpf : w.dataSize - startFrame * bpf;
  const out = new ArrayBuffer(44 + bytes);
  const dv = new DataView(out);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); dv.setUint32(4, 36 + bytes, true); put(8, "WAVE");
  put(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, w.channels, true); dv.setUint32(24, w.rate, true);
  dv.setUint32(28, w.rate * bpf, true); dv.setUint16(32, bpf, true); dv.setUint16(34, 16, true);
  put(36, "data"); dv.setUint32(40, bytes, true);
  new Uint8Array(out, 44).set(new Uint8Array(w.buf, w.dataOffset + startFrame * bpf, bytes));
  return out;
}
function b64ToBuf(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

// ── 加载素材 ────────────────────────────────────────────────────────────
// 素材以 MP3 内嵌（体积只有 WAV 的 1/20；而且真实素材本来就是压缩格式）。
// 用浏览器原生解码成 48 kHz 立体声，再还原成 WAV 字节——
// 后面所有环节（选区、送进 wasm、播放）拿到的都是一份普通的 16-bit WAV。
function audioBufferToWav(ab) {
  const ch = ab.numberOfChannels, rate = ab.sampleRate, frames = ab.length;
  const bpf = ch * 2;
  const out = new ArrayBuffer(44 + frames * bpf);
  const dv = new DataView(out);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); dv.setUint32(4, 36 + frames * bpf, true); put(8, "WAVE");
  put(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, ch, true); dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * bpf, true); dv.setUint16(32, bpf, true); dv.setUint16(34, 16, true);
  put(36, "data"); dv.setUint32(40, frames * bpf, true);
  const view = new DataView(out, 44);
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(ab.getChannelData(c));
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < ch; c++) {
      const v = Math.max(-1, Math.min(1, chans[c][i]));
      view.setInt16((i * ch + c) * 2, v < 0 ? v * 32768 : v * 32767, true);
    }
  }
  return out;
}
const blobUrl = (buf, mime) => URL.createObjectURL(new Blob([buf], { type: mime }));

let before = null;
(async () => {
  const ctx = new OfflineAudioContext(2, 48000, 48000);
  const decoded = await ctx.decodeAudioData(b64ToBuf(BEFORE_MP3_B64).slice(0));
  const buf = audioBufferToWav(decoded);
  before = { ...parseWav(buf), buf };
  drawWave();
})();

// ── 波形 + 拖拽选区 ─────────────────────────────────────────────────────
const cv = document.getElementById("wave");
let sel = null, drag = null;

function drawWave() {
  if (!before) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  // 选区底色：告诉用户"这段会被送去处理"
  if (sel) {
    g.fillStyle = "rgba(45,212,191,0.14)";
    g.fillRect(sel.a * w, 0, (sel.b - sel.a) * w, h);
  }

  // 波形：按像素列取该列的最大幅值（比抽样更能反映真实包络）
  const s = new Int16Array(before.buf, before.dataOffset, before.dataSize / 2);
  const ch = before.channels;
  g.strokeStyle = "#5b6676"; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x < w; x++) {
    const f0 = Math.floor(x / w * before.frames), f1 = Math.max(f0 + 1, Math.floor((x + 1) / w * before.frames));
    let mn = 0, mx = 0;
    for (let f = f0; f < f1; f++) { const v = s[f * ch]; if (v < mn) mn = v; if (v > mx) mx = v; }
    const y0 = h / 2 - mx / 32768 * h / 2 * 0.95, y1 = h / 2 - mn / 32768 * h / 2 * 0.95;
    g.moveTo(x + 0.5, y0); g.lineTo(x + 0.5, y1);
  }
  g.stroke();
}

function posToFrame(ev) {
  if (!before) return 0;
  const r = cv.getBoundingClientRect();
  return Math.max(0, Math.min(before.frames, Math.round((ev.clientX - r.left) / r.width * before.frames)));
}
const fmtT = (sec) => `${Math.floor(sec / 60)}:${String((sec % 60).toFixed(1)).padStart(4, "0")}`;

cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  drag = posToFrame(e); sel = null; drawWave(); updateSel();
});
cv.addEventListener("pointermove", (e) => {
  if (drag === null) return;
  const f = posToFrame(e);
  sel = { a: Math.min(drag, f) / before.frames, b: Math.max(drag, f) / before.frames,
          fa: Math.min(drag, f), fb: Math.max(drag, f) };
  drawWave(); updateSel();
});
cv.addEventListener("pointerup", () => { drag = null; });

function updateSel() {
  const info = document.getElementById("selInfo"), run = document.getElementById("run");
  if (!before) { info.textContent = "正在解码素材…"; run.disabled = true; return; }
  if (!sel || sel.fb - sel.fa < before.rate * 0.2) {
    info.textContent = "拖动波形选择要处理的片段（至少 0.2 秒）";
    run.disabled = true; sel = null; return;
  }
  info.innerHTML = `已选 <b>${fmtT(sel.fa / before.rate)} – ${fmtT(sel.fb / before.rate)}</b>` +
                   `（<b>${((sel.fb - sel.fa) / before.rate).toFixed(1)} 秒</b>）`;
  run.disabled = false;
}

// ── 在浏览器里跑 wasm 技能 ──────────────────────────────────────────────
const ARGV = ["vad", "--speech-only", "--resample", "16000", "--mono", "--normalize", "-16"];
const wasmBytes = b64ToBuf(VAD_WASM_B64);
// 把 shim 源码求值成一个函数：源码里定义 makeWASI，这里把它取出来
const makeWASI = new Function(WASI_SHIM_SRC + "\nreturn makeWASI;")();
// 编译一次、复用：第一次点击的耗时会含编译（如实标注），之后是纯处理耗时
let compiledModule = null;

document.getElementById("run").addEventListener("click", async () => {
  const btn = document.getElementById("run"), status = document.getElementById("status");
  btn.disabled = true; status.textContent = "处理中…";
  try {
    const input = sliceWav(before, sel.fa, sel.fb);
    const t0 = performance.now();
    const wasCompiled = compiledModule !== null;
    if (!compiledModule) compiledModule = await WebAssembly.compile(wasmBytes);
    const tCompile = performance.now() - t0;
    const wasi = makeWASI(ARGV, new Uint8Array(input));
    const instance = await WebAssembly.instantiate(compiledModule, wasi.imports);
    wasi.bind(instance.exports.memory);
    const t1 = performance.now();
    try { instance.exports._start(); } catch (e) { if (!e.exitCode) throw e; }
    const ms = performance.now() - t1;       // 纯处理耗时（编译另计）
    wasi.bind(instance.exports.memory);

    const outBuf = wasi.stdout().buffer;
    const after = parseWav(outBuf);

    document.getElementById("audioBefore").src = blobUrl(input, "audio/wav");
    document.getElementById("audioAfter").src = blobUrl(outBuf, "audio/wav");
    document.getElementById("mBefore").textContent =
      `${(before.rate/1000).toFixed(0)} kHz · ${before.channels} 声道 · ${((sel.fb-sel.fa)/before.rate).toFixed(1)} s`;
    document.getElementById("mAfter").textContent =
      `${(after.rate/1000).toFixed(0)} kHz · ${after.channels} 声道 · ${(after.frames/after.rate).toFixed(1)} s`;
    document.getElementById("mTime").innerHTML =
      `<span class="big">${ms.toFixed(0)} ms</span>` +
      (wasCompiled ? "" : `（另有 wasm 编译 ${tCompile.toFixed(0)} ms，仅首次）`);
    document.getElementById("mRT").innerHTML =
      `<span class="big">${(((sel.fb-sel.fa)/before.rate)/(ms/1000)).toFixed(0)}×</span> 实时` +
      `（wasm 在浏览器里，无 JIT 预热）`;
    document.getElementById("result").classList.remove("hide");
    const err = wasi.stderr();
    status.textContent = err.includes("响度") ? err.trim().split("\n").pop() : "";
  } catch (e) {
    status.textContent = "失败: " + e.message;
  } finally {
    btn.disabled = false;
  }
});

window.addEventListener("resize", drawWave);
drawWave();
</script>
</body>
</html>
